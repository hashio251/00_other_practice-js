<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02_ramen-introduction | おすすめラーメンさいと</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header></header>
  <main>
    <h1>おすすめのラーメン屋さんを紹介してくれる<span class="h1-span">ロボットです</span></h1>
    <div class="main-container">
      <div id="robo-img">
        <img src="ramen-robo.png" alt="ラーメンロボットの画像">
      </div>
      <div class="output-js">
        <div id="robo-comment" class="hukidashi">
          <p class="store-name">食べたいラーメンの種類を<span class="p-span">選択するロボ ♪</span></p>
          <p class="store-station"></p>
        </div>
        <div id="map-container">
          <h2>📍 Map</h2>
        
          <div id="map-display">
          </div>
        </div>
      </div>
    </div>
    <div id="btn">
      <select name="category" id="category">
        <option value="">食べたいラーメンの種類を選んでください</option>
        <option value="soy-source">醤油</option>
        <option value="miso">味噌</option>
        <option value="niboshi">煮干し</option>
        <option value="solt">塩</option>
        <option value="aburasoba">油そば</option>
      </select>
      <button class="select-btn">OK</button>
    </div>
  </main>
  <footer></footer>
  <script src="main.js"></script>
</body>

</html>
